# 클러스터 내부에서 접근 가능한 서비스 생성
apiVersion: v1
kind: Service
metadata:
  name: likelion-backend
  namespace: inspire12
spec:
  selector:
    app: likelion-backend  # 위 Deployment와 연결되는 label
  ports:
    - port: 80             # 클러스터 내에서 노출할 포트 (가상 IP 기준)
      targetPort: 8080     # 실제 컨테이너가 열고 있는 포트
  type: ClusterIP          # 클러스터 내부에서만 접근 가능한 기본 서비스 타입